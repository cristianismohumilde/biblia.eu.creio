<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biblia.Creio.EU</title>
    <meta name="description" content="Language router for Biblia.Creio.EU" />
    <meta http-equiv="refresh" content="0; url=pt/" />
  </head>
  <body>
    <p>Redirecting to your language...</p>
    <p>
      If redirection does not happen: <a href="pt/">Português</a> | <a href="en/">English</a>
    </p>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var forced = params.get("lang");
        var remembered = localStorage.getItem("preferred-lang");
        var browserLang = (navigator.language || "en").toLowerCase();

        var targetLang = "en";
        if (forced === "pt" || forced === "en") {
          targetLang = forced;
        } else if (remembered === "pt" || remembered === "en") {
          targetLang = remembered;
        } else if (browserLang.startsWith("pt")) {
          targetLang = "pt";
        }

        localStorage.setItem("preferred-lang", targetLang);

        var suffix = targetLang + "/";
        var next = suffix + window.location.search + window.location.hash;
        window.location.replace(next);
      })();
    </script>
  </body>
</html>
